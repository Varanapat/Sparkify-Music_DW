name: sparkify_dw
version: '1.0.0'
config-version: 2

profile: sparkify_dw

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# สร้างฟังก์ชันแก้ชื่อที่ encoding เพี้ยนก่อน model ใดๆ จะใช้ (ดู macros/fix_mojibake.sql)
on-run-start:
  - "{{ create_fix_mojibake_function() }}"

models:
  sparkify_dw:                   # ต้องตรงกับ name ของ project
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    metrics:
      +materialized: view
      +schema: metrics
    reporting:
      +materialized: view
      +schema: reporting

seeds:
  +schema: raw
