version: 2

sources:
  - name: raw
    schema: raw
    description: "ข้อมูลดิบที่ DAG sparkify_etl โหลดเข้ามา 1 แถวต่อ 1 JSON object"
    tables:
      - name: sparkify_events
        description: "Event log จาก mini_sparkify_event_data.json (1 บรรทัด = 1 event)"
        columns:
          - name: line_number
            description: "ลำดับบรรทัดในไฟล์ต้นทาง"
            data_tests: [not_null, unique]
          - name: payload
            data_tests: [not_null]

      - name: songs
        description: "Song metadata จาก postgres_sample/song_data (1 ไฟล์ = 1 เพลง)"
        columns:
          - name: source_file
            data_tests: [not_null, unique]
          - name: payload
            data_tests: [not_null]
