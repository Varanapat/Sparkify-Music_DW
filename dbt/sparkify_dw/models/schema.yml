version: 2

models:
  - name: stg_events
    description: "Event log ที่ปรับชนิดข้อมูลแล้ว 1 แถวต่อ 1 event (ทุก page) เวลาเป็น UTC"
    columns:
      - name: event_id
        description: "ลำดับบรรทัดในไฟล์ต้นทาง ใช้เป็น key ของ event"
        data_tests: [not_null, unique]
      - name: event_ts
        description: "เวลาที่เกิด event (UTC)"
        data_tests: [not_null]
      - name: user_id
        description: "รหัสผู้ใช้ เป็น null เมื่อ auth = Guest หรือ Logged Out"
        data_tests:
          - not_null:
              config:
                where: "auth in ('Logged In', 'Cancelled')"
      - name: session_id
        description: "รหัส session ไม่ unique ข้ามผู้ใช้ ต้องใช้คู่กับ user_id"
        data_tests: [not_null]
      - name: page
        description: "ประเภท event เช่น NextSong, Home, Thumbs Up"
        data_tests:
          - not_null
          - accepted_values:
              values: ['NextSong', 'Home', 'Thumbs Up', 'Add to Playlist', 'Add Friend',
                       'Roll Advert', 'Login', 'Logout', 'Thumbs Down', 'Downgrade', 'Help',
                       'Settings', 'About', 'Upgrade', 'Save Settings', 'Error',
                       'Submit Upgrade', 'Submit Downgrade', 'Cancel',
                       'Cancellation Confirmation', 'Register', 'Submit Registration']
      - name: auth
        data_tests:
          - accepted_values:
              values: ['Logged In', 'Logged Out', 'Guest', 'Cancelled']
      - name: level
        description: "แผนของผู้ใช้ ณ เวลาที่เกิด event"
        data_tests:
          - not_null
          - accepted_values:
              values: ['free', 'paid']
      - name: http_status
        data_tests:
          - accepted_values:
              values: [200, 307, 404]
              quote: false
      - name: artist_name
        data_tests:
          - not_null:
              config:
                where: "is_songplay"
      - name: song_title
        data_tests:
          - not_null:
              config:
                where: "is_songplay"
      - name: length_seconds
        data_tests:
          - not_null:
              config:
                where: "is_songplay"

  - name: stg_songs
    description: "Song metadata 1 แถวต่อ 1 เพลง"
    columns:
      - name: song_id
        data_tests: [not_null, unique]
      - name: song_title
        data_tests: [not_null]
      - name: artist_id
        data_tests: [not_null]
      - name: artist_name
        data_tests: [not_null]
      - name: duration_seconds
        data_tests: [not_null]

  - name: int_user_level_versions
    description: "event ของผู้ใช้ที่ login พร้อมเลข SCD2 version (เพิ่ม 1 ทุกครั้งที่ level เปลี่ยน)"
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: user_version
        data_tests: [not_null]

  - name: dim_user
    description: "มิติผู้ใช้ SCD Type 2 ตาม level รวม Unknown member user_key = '-1'"
    columns:
      - name: user_key
        description: "Surrogate key = md5(user_id | user_version)"
        data_tests: [not_null, unique]
      - name: level
        data_tests:
          - accepted_values:
              values: ['free', 'paid']
      - name: valid_from
        description: "เริ่มต้นช่วง (รวม)"
        data_tests: [not_null]
      - name: valid_to
        description: "สิ้นสุดช่วง (ไม่รวม) version ปัจจุบันเป็น 9999-12-31"
        data_tests: [not_null]

  - name: dim_artist
    description: "มิติศิลปิน 1 แถวต่อ 1 ชื่อศิลปิน"
    columns:
      - name: artist_key
        data_tests: [not_null, unique]
      - name: artist_name
        data_tests: [not_null, unique]

  - name: dim_song
    description: "มิติเพลง 1 แถวต่อ 1 recording (ศิลปิน, ชื่อเพลง, ความยาว)"
    columns:
      - name: song_key
        data_tests: [not_null, unique]
      - name: artist_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_artist')
              field: artist_key

  - name: dim_date
    description: "มิติวันที่ ทุกวันในช่วงข้อมูล"
    columns:
      - name: date_key
        description: "รูปแบบ YYYYMMDD"
        data_tests: [not_null, unique]
      - name: full_date
        data_tests: [not_null, unique]

  - name: dim_time
    description: "มิติเวลาในวัน ระดับชั่วโมง (UTC)"
    columns:
      - name: time_key
        data_tests: [not_null, unique]

  - name: fct_songplay
    description: "Fact การเล่นเพลง 1 แถวต่อ 1 NextSong event"
    columns:
      - name: songplay_id
        data_tests: [not_null, unique]
      - name: date_key
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: time_key
        data_tests:
          - relationships:
              to: ref('dim_time')
              field: time_key
      - name: user_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_user')
              field: user_key
      - name: song_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_song')
              field: song_key
      - name: artist_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_artist')
              field: artist_key
      - name: length_seconds
        data_tests: [not_null]

  - name: fct_user_event
    description: "Fact event ทุกประเภท 1 แถวต่อ 1 event"
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: date_key
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: time_key
        data_tests:
          - relationships:
              to: ref('dim_time')
              field: time_key
      - name: user_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_user')
              field: user_key
